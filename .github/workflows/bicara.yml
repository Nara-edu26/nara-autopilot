name: Nara berbicara (pasang klip pembuka)
# Dijalankan manual setelah video lip-sync dibuat di ElevenLabs (Image & Video › Lip sync):
# unduh klip → buang latar (engine/potong.py) → simpan di branch media (_bicara) → render ulang.
# Klip hanya tampil bila config.json brand.avatar_bicara = true.

on:
  workflow_dispatch:
    inputs:
      post:
        description: "id post, mis. 2026-11-05-malam"
        required: true
      url:
        description: "tautan unduhan video lip-sync (mp4)"
        required: true

permissions:
  contents: write
  actions: write

# Satu antrean per post: GitHub hanya menyimpan satu run menunggu per grup, jadi grup bersama membatalkan
# klip lain yang dikirim berdekatan. Tabrakan push ke branch media ditangani dengan coba ulang di bawah.
concurrency:
  group: bicara-${{ inputs.post }}
  cancel-in-progress: false

jobs:
  pasang:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Unduh klip
        env:
          URL: ${{ inputs.url }}
          POST: ${{ inputs.post }}
        run: |
          mkdir -p docs/media/_bicara
          curl -sSfL --retry 3 -o "docs/media/_bicara/$POST.mp4" "$URL"
          ls -l "docs/media/_bicara/$POST.mp4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang alat
        run: |
          pip install -q onnxruntime==1.20.1 "numpy>=1.26,<3" "Pillow>=10.4,<13" "scipy>=1.13,<2" requests==2.32.3
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: actions/cache@v4
        with:
          path: ~/model
          key: isnet-general-use-v1
      - name: Buang latar
        env:
          POST: ${{ inputs.post }}
        run: |
          mkdir -p ~/model
          [ -s ~/model/isnet-general-use.onnx ] || curl -sSfL --retry 3 -o ~/model/isnet-general-use.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx
          python engine/potong.py --id "$POST" --model ~/model/isnet-general-use.onnx
      - name: Catat suara pembuka yang dipakai klip (bibir harus cocok dengan suara reel)
        env:
          POST: ${{ inputs.post }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          git fetch --depth 1 origin +media:refs/remotes/origin/media
          git --work-tree=docs/media checkout origin/media -- _suara 2>/dev/null || true
          git reset -q
          v=$(python engine/suara.py --id "$POST" --pembuka | tail -1)
          python engine/bicara.py --selaraskan "$POST" "$v"
          cat "docs/media/_bicara/$POST.suara"
      - name: Tunggu render yang sedang jalan (render menimpa branch media)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/render.yml/runs?per_page=10" \
                --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            [ "$n" = "0" ] && exit 0
            echo "render masih jalan ($n), tunggu..."; sleep 20
          done
          echo "::error::render tidak selesai dalam 30 menit"; exit 1
      - name: Simpan di branch media
        env:
          POST: ${{ inputs.post }}
        run: |
          git config --global user.name "nara-autopilot[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for coba in 1 2 3 4 5 6; do
            git fetch -q --depth 1 origin +media:refs/remotes/origin/media
            rm -rf ../media; git worktree prune
            git worktree add -q -f ../media origin/media
            mkdir -p ../media/_bicara
            cp docs/media/_bicara/"$POST".* ../media/_bicara/
            if (cd ../media && git add _bicara && git commit -q -m "bicara: $POST" && git push -q origin HEAD:media); then
              echo "tersimpan (percobaan $coba)"; exit 0
            fi
            echo "push bertabrakan, coba lagi..."; sleep $((10 * coba))
          done
          echo "::error::gagal menyimpan klip ke branch media"; exit 1
      - name: Render ulang
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run render.yml --ref main
