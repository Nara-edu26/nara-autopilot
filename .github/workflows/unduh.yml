name: Unduh berkas (untuk pratinjau)
# Dijalankan manual. Mengunduh tautan (dipisah spasi) dan menyimpannya di branch `unduhan` supaya bisa diambil
# lewat git (proxy sesi memblokir sebagian situs, runner GitHub tidak).

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "nama=tautan dipisah spasi, mis. a.mp4=https://... b.mp4=https://..."
        required: true

permissions:
  contents: write

jobs:
  unduh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Unduh
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir out && cd out
          for pair in $URLS; do
            nama="${pair%%=*}"; url="${pair#*=}"
            curl -sSfL --retry 3 -o "$nama" "$url" && ls -l "$nama"
          done
          git init -q -b unduhan
          git config user.name "nara-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "unduhan $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" unduhan
