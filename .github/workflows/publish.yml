name: Terbit
# Menerbitkan satu post per slot: 07.07, 12.07, 19.07 WIB.
# Menit :07 dipakai karena jadwal tepat di :00 paling sering tertunda di GitHub.

on:
  schedule:
    - cron: "7 0 * * *"    # pagi  07.07 WIB
    - cron: "7 5 * * *"    # siang 12.07 WIB
    - cron: "7 12 * * *"   # malam 19.07 WIB
  workflow_dispatch:
    inputs:
      slot:
        description: "pagi / siang / malam"
        required: true
        type: choice
        options: [pagi, siang, malam]
      tanggal:
        description: "YYYY-MM-DD (kosongkan = hari ini WIB)"
        required: false
      uji:
        description: "Uji kering (tidak menerbitkan)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  terbit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Terbitkan
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--slot ${{ inputs.slot }}"
            [ -n "${{ inputs.tanggal }}" ] && ARGS="$ARGS --tanggal ${{ inputs.tanggal }}"
            [ "${{ inputs.uji }}" = "true" ] && ARGS="$ARGS --uji"
          fi
          python engine/publish.py $ARGS
      - name: Catat
        if: always()
        run: |
          bash .github/scripts/commit.sh "terbit: catat post" data/posted.csv
