name: Suara contoh (ElevenLabs)
# Dijalankan manual. "daftar" = lihat model & suara yang tersedia; "contoh" = buat mp3 contoh untuk voice_id tertentu.
# Kunci API hanya dibaca dari secret ELEVENLABS_API_KEY; hasil diunggah sebagai artifact "suara".

on:
  workflow_dispatch:
    inputs:
      aksi:
        description: "daftar, contoh, atau gaya"
        required: true
        default: "daftar"
      voice:
        description: "voice_id dipisah koma (untuk aksi contoh)"
        required: false
        default: ""
      model:
        description: "model_id"
        required: false
        default: "eleven_multilingual_v2"
      cari:
        description: "kata kunci Voice Library dipisah koma (untuk aksi daftar)"
        required: false
        default: ""
      post:
        description: "id post yang naskahnya dibacakan"
        required: false
        default: "2026-11-03-siang"
      varian:
        description: "untuk aksi gaya: varian dipisah koma (v2-alami, v4-alami, v3-alami)"
        required: false
        default: "v2-alami,v4-alami,v3-alami"

permissions:
  contents: write

jobs:
  suara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.32.3
      - name: Jalankan
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AKSI: ${{ inputs.aksi }}
          VOICE: ${{ inputs.voice }}
          MODEL: ${{ inputs.model }}
          POST: ${{ inputs.post }}
          CARI: ${{ inputs.cari }}
          VARIAN: ${{ inputs.varian }}
        run: python engine/suara_contoh.py "$AKSI" --voice "$VOICE" --model "$MODEL" --post "$POST"
      - name: Simpan hasil ke branch suara-contoh (bisa diambil lewat git)
        if: always()
        run: |
          [ -d suara ] || exit 0
          cd suara
          git init -q -b suara-contoh
          git config user.name "nara-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "suara contoh $(date -u +%FT%TZ)" || exit 0
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" suara-contoh
          rm -rf .git
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suara
          path: suara/
          if-no-files-found: ignore
          retention-days: 7
