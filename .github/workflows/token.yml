name: Perpanjang token
# Token Instagram berlaku 60 hari. Diperpanjang tiap Senin supaya tidak pernah mati.

on:
  schedule:
    - cron: "17 1 * * 1"   # Senin 08.17 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Perpanjang
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python engine/refresh_token.py
