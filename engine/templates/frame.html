<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Nara frame</title>
<style>
@font-face{font-family:"InterDisplay";font-weight:700;src:url("../fonts/InterDisplay-Bold.woff2") format("woff2")}
@font-face{font-family:"InterDisplay";font-weight:800;src:url("../fonts/InterDisplay-ExtraBold.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:400;src:url("../fonts/Inter-Regular.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:500;src:url("../fonts/Inter-Medium.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:600;src:url("../fonts/Inter-SemiBold.woff2") format("woff2")}

:root{
  --olive:#6B7B4F; --olive-dark:#4E5A39; --cream:#F3EDE2; --paper:#FBF8F2;
  --ink:#2B2B26; --muted:#6E6B5E; --line:#DDD5C4; --sage:#C9D1B5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}

#f{position:relative;overflow:hidden;display:flex;flex-direction:column}
#f.carousel{width:1080px;height:1350px;padding:88px 96px 84px}
#f.reel{width:1080px;height:1920px;padding:250px 92px 420px}
#f.reel.talker{padding-bottom:800px}   /* ruang untuk Nara berbicara di kanan bawah */

/* tema warna */
#f.t-cream{background:var(--cream);color:var(--ink);--accent:var(--olive-dark);--soft:var(--muted);--hlbg:#E4DCC8}
#f.t-olive{background:var(--olive);color:var(--cream);--accent:#F3EDE2;--soft:#E2E6D3;--hlbg:rgba(243,237,226,.18)}
#f.t-dark{background:var(--olive-dark);color:var(--cream);--accent:var(--sage);--soft:#D5DBC3;--hlbg:rgba(201,209,181,.2)}

/* tekstur halus: lingkaran besar samar di pojok supaya latar tidak datar */
#f::before{content:"";position:absolute;width:900px;height:900px;border-radius:50%;right:-420px;top:-380px;
  background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,0) 70%);pointer-events:none}
#f.t-cream::before{background:radial-gradient(circle,rgba(107,123,79,.08),rgba(107,123,79,0) 70%)}

.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:26px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--soft);position:relative;z-index:1}
.reel .top{font-size:30px}
.top .sig{display:flex;align-items:center;gap:14px}
.top .dot{width:18px;height:18px;border-radius:50%;background:currentColor;opacity:.9}
.top .ava{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid currentColor}
.carousel .top .ava{width:46px;height:46px}
/* wajah Nara di frame pembuka */
.presenter{display:flex;align-items:center;gap:34px}
.presenter img{width:300px;height:300px;border-radius:50%;object-fit:cover;border:6px solid var(--accent);flex:none}
.carousel .presenter img{width:190px;height:190px;border-width:5px}
.presenter .hi{font-family:"InterDisplay";font-weight:800;font-size:66px;line-height:1.02;letter-spacing:-.02em;color:var(--accent)}
.carousel .presenter .hi{font-size:50px}
.presenter .role{font-weight:600;font-size:34px;line-height:1.25;color:var(--soft);margin-top:12px}
.carousel .presenter .role{font-size:28px}
.top .pg{font-variant-numeric:tabular-nums;letter-spacing:.04em}

.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px;position:relative;z-index:1;min-height:0}
.reel .body{gap:44px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:600;color:var(--soft);position:relative;z-index:1;min-height:40px}
.reel .foot{display:none}

.kicker{align-self:flex-start;font-weight:600;font-size:30px;letter-spacing:.02em;padding:12px 26px;border-radius:999px;
  border:2px solid currentColor;color:var(--accent)}
.reel .kicker{font-size:36px}
.title{font-family:"InterDisplay";font-weight:800;line-height:1.02;letter-spacing:-.025em;text-wrap:balance}
.h2{font-family:"InterDisplay";font-weight:700;line-height:1.06;letter-spacing:-.02em;text-wrap:balance}
.sub{font-weight:500;line-height:1.32;color:var(--soft);text-wrap:pretty}
.txt{font-weight:500;line-height:1.38;text-wrap:pretty}
.muted{color:var(--soft)}
em.hl{font-style:normal;color:var(--accent);background:linear-gradient(transparent 62%,var(--hlbg) 62%);padding:0 .06em}
.t-olive em.hl,.t-dark em.hl{background:none;text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.12em}

/* number */
.label{font-weight:600;font-size:34px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.reel .label{font-size:40px}
.eq{align-self:flex-start;font-weight:600;font-variant-numeric:tabular-nums;border:2px solid var(--line);background:var(--paper);
  border-radius:22px;padding:22px 30px;line-height:1.25;color:var(--ink)}
.value{font-family:"InterDisplay";font-weight:800;letter-spacing:-.035em;line-height:.95;color:var(--accent);font-variant-numeric:tabular-nums}
.t-olive .eq,.t-dark .eq{background:rgba(255,255,255,.08);border-color:rgba(243,237,226,.35);color:var(--cream)}

/* point */
.idx{font-family:"InterDisplay";font-weight:800;font-size:120px;color:var(--accent);letter-spacing:-.04em;line-height:.9;opacity:.9}
.reel .idx{font-size:140px}
.rule{height:6px;width:120px;border-radius:3px;background:var(--accent);opacity:.9}

/* list */
ul.items{list-style:none;display:flex;flex-direction:column;gap:22px}
ul.items li{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;font-weight:500;line-height:1.3}
ul.items li .b{font-family:"InterDisplay";font-weight:800;color:var(--accent);min-width:1.2em;font-variant-numeric:tabular-nums}
ul.items li + li{padding-top:22px;border-top:2px solid var(--line)}
.t-olive ul.items li + li,.t-dark ul.items li + li{border-color:rgba(243,237,226,.25)}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.reel .cmp{grid-template-columns:1fr;gap:28px}
.card{border-radius:28px;padding:34px 32px;display:flex;flex-direction:column;gap:16px}
.card.l{background:var(--paper);border:2px solid var(--line);color:var(--ink)}
.card.r{background:var(--olive);color:var(--cream)}
.card .ch{font-family:"InterDisplay";font-weight:800;letter-spacing:-.02em;line-height:1.05}
.card .ct{font-weight:500;line-height:1.33}

/* statement */
.quote-mark{font-family:"InterDisplay";font-weight:800;font-size:180px;line-height:.6;color:var(--accent);opacity:.6;height:80px}

/* cta */
.pill{align-self:flex-start;display:flex;align-items:center;gap:18px;background:var(--cream);color:var(--olive-dark);
  font-weight:700;border-radius:999px;padding:24px 40px;font-family:"InterDisplay";letter-spacing:-.01em}
.pill .arrow{font-family:"Inter";font-weight:600}
.t-cream .pill{background:var(--olive);color:var(--cream)}
.closing{font-family:"InterDisplay";font-weight:700;letter-spacing:-.015em;color:var(--accent)}

.reveal{transition:none}
.stage0 .reveal{opacity:0}

/* ================= GAYA BARU (post dengan "seri") =================
   Tiga seri: bedah (krem), tanggal-tua (hitam), tim (kuning). Hook tanpa sapaan, benda nyata, Nara besar. */
@font-face{font-family:"Mono";font-weight:400;src:url("../fonts/DejaVuSansMono.ttf") format("truetype")}
@font-face{font-family:"Mono";font-weight:700;src:url("../fonts/DejaVuSansMono-Bold.ttf") format("truetype")}
#f.g2{color:var(--ink)}
#f.g2::before{display:none}
#f.g2.reel{padding:262px 84px 430px}
#f.g2.carousel{padding:72px 80px 80px}
#f.s-bedah{background:#F3EDE2;--ink:#1E2618;--accent:#1E2618;--soft:#5E5A4E;--line:#DDD5C4;--chipbg:#1E2618;--chipfg:#F6D365;--val:#1E2618;--mark:#F6D365}
#f.s-tanggal-tua{background:#121512;--ink:#F4F1EA;--accent:#FF7A6E;--soft:#A9B09B;--line:rgba(255,255,255,.16);--chipbg:#E5484D;--chipfg:#fff;--val:#FF7A6E;--mark:#FF7A6E}
#f.s-tim{background:#F2B137;--ink:#1E2618;--accent:#1E2618;--soft:#5A4415;--line:rgba(30,38,24,.22);--chipbg:#1E2618;--chipfg:#F2B137;--val:#1E2618;--mark:#1E2618}
.g2 .g2top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:3}
.g2 .chip{background:var(--chipbg);color:var(--chipfg);font-weight:600;border-radius:999px;padding:12px 26px;font-size:32px;letter-spacing:.01em;white-space:nowrap}
.g2.carousel .chip{font-size:28px;padding:10px 22px}
.g2 .hdl{text-align:right;font-weight:600;font-size:30px;line-height:1.3;color:var(--soft);letter-spacing:.02em}
.g2 .hdl small{display:block;font-size:24px;opacity:.85}
.g2.carousel .hdl{font-size:26px}.g2.carousel .hdl small{font-size:21px}
.g2 .body{justify-content:flex-start;gap:40px;padding-top:34px;z-index:3}
.g2.reel:not(.ft-cover) .body{justify-content:center;padding-top:0}
.g2 .hook{font-family:"InterDisplay";font-weight:800;letter-spacing:-.03em;line-height:1.0;text-wrap:balance}
.g2 .h2{color:var(--ink)}
.g2 .sub,.g2 .txt.muted{color:var(--soft)}
.g2 em.hl{color:inherit;background:linear-gradient(transparent 58%,var(--mark) 58%);text-decoration:none;padding:0 .04em}
.s-tanggal-tua em.hl{color:var(--mark);background:none}
.s-tim em.hl{color:#fff;background:var(--mark);padding:0 .14em;border-radius:.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.g2 .value{color:var(--val)}
.g2 .label{color:var(--soft)}
.g2 .eq{background:rgba(255,255,255,.55);border-color:var(--line);color:var(--ink)}
.s-tanggal-tua .eq{background:rgba(255,255,255,.07)}
.g2 .idx{color:var(--accent)}
.g2 .rule{background:var(--accent)}
.g2 ul.items li .b{color:var(--accent)}
.g2 ul.items li + li{border-color:var(--line)}
.g2 .quote-mark{color:var(--accent)}
.g2 .closing{color:var(--soft);font-family:"Inter";font-weight:600}
.g2 .pill{background:var(--chipbg);color:var(--chipfg)}
.g2 .card.l{background:rgba(255,255,255,.6);border-color:var(--line)}
.g2 .card.r{background:var(--chipbg);color:var(--chipfg)}
/* Nara tanpa latar */
.g2 .nara{position:absolute;z-index:2;bottom:0;pointer-events:none}
.g2.reel .nara{width:1000px}
.g2.reel .nara.kanan{right:-230px}
.g2.reel .nara.kiri{left:-230px}
.g2.reel.ft-cta .nara{width:760px;right:-170px;left:auto}
.g2.reel .nara.kecil{width:580px;right:-120px;left:auto}
#f.g2.reel.ada-nara:not(.ft-cover):not(.ft-cta){padding-bottom:560px}
.g2 .nw{white-space:nowrap}
.g2.carousel .nara{width:640px}
.g2.carousel .nara.kanan{right:-150px}
.g2.carousel .nara.kiri{left:-150px}
.g2.carousel.ft-cta .nara{width:520px;right:-120px;left:auto}
.g2.ft-cta .body{max-width:640px}
.g2.talker .nara{display:none}
/* benda: struk, mutasi, polling */
.obj{position:relative;z-index:3;align-self:flex-start}
.g2.ft-cover .obj{margin-top:20px}
.g2.ft-cover .obj.kanan{align-self:flex-end}
.struk{background:#FFFDF8;color:#2B2B26;border-radius:10px;padding:38px 40px 44px;width:560px;
  box-shadow:0 30px 60px rgba(40,30,10,.22),0 2px 0 rgba(0,0,0,.04);transform:rotate(-3deg);
  font-family:"Mono",monospace;font-size:31px;line-height:1.55;font-variant-numeric:tabular-nums}
.struk.lebar{width:860px;font-size:40px;transform:rotate(-1.5deg)}
.struk.lebar h4{font-size:28px}
.struk:after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;
  background:radial-gradient(circle at 12px 0,#FFFDF8 12px,transparent 13px) 0 0/24px 18px repeat-x}
.struk h4{font-family:"Inter";font-weight:600;font-size:25px;letter-spacing:.14em;color:#6E6B5E;margin-bottom:12px;text-transform:uppercase}
.struk .row{display:flex;justify-content:space-between;gap:24px}
.struk .row span:first-child{white-space:normal}
.struk .row span:last-child{white-space:nowrap}
.struk .sep{border-top:3px dashed #CFC6B2;margin:12px 0}
.struk .tot{font-weight:700;font-size:1.25em}
.struk .tot span:last-child{background:#1E2618;color:#F6D365;padding:0 12px;border-radius:6px}
.hp{background:#FAFAF7;color:#1C1C1A;border-radius:44px;padding:34px 34px 38px;width:600px;transform:rotate(3deg);
  box-shadow:0 40px 80px rgba(0,0,0,.45);border:10px solid #2A2E29;font-size:30px}
.hp h4{font-weight:600;font-size:25px;color:#6B6B66;letter-spacing:.08em;margin-bottom:14px;text-transform:uppercase}
.hp .tx{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:13px 0;border-top:2px solid #ECEAE3}
.hp .tx .n{font-weight:600}
.hp .tx small{grid-column:1;font-size:22px;color:#8A8A84;font-weight:500}
.hp .tx .v{grid-row:1/3;grid-column:2;align-self:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hp .in{color:#16A34A}.hp .out{color:#D93A3F}
.hp .saldo{margin-top:12px;background:#121512;color:#fff;border-radius:22px;padding:18px 24px;display:flex;justify-content:space-between;
  align-items:center;font-weight:600;font-size:28px}
.hp .saldo b{font-family:"InterDisplay";font-weight:800;font-size:46px;color:#FF7A6E;font-variant-numeric:tabular-nums}
.hp.lebar{width:820px;font-size:38px;transform:rotate(1.5deg)}
.hp.lebar h4{font-size:28px}.hp.lebar .tx small{font-size:27px}.hp.lebar .saldo{font-size:34px}.hp.lebar .saldo b{font-size:60px}
.g2.carousel .hp.lebar{width:740px;font-size:32px}
.poll{display:flex;flex-direction:column;gap:22px;width:560px}
.poll .opt{background:#FFF6E3;color:#1E2618;border:4px solid #1E2618;border-radius:26px;padding:20px 26px;font-family:"InterDisplay";
  font-weight:800;font-size:46px;display:flex;gap:22px;align-items:center;box-shadow:8px 8px 0 #1E2618;letter-spacing:-.01em}
.poll .opt i{font-style:normal;flex:none;width:64px;height:64px;border-radius:50%;background:#1E2618;color:#F2B137;display:grid;place-items:center;font-size:36px}
.poll .ask{font-weight:600;font-size:34px;line-height:1.3;color:var(--ink);margin-top:6px}
.g2.carousel .struk{font-size:26px;width:480px;padding:30px 32px 36px}
.g2.carousel .struk.lebar{width:760px;font-size:32px}
.g2.carousel .hp{font-size:25px;width:500px;padding:26px 26px 30px}
.g2.carousel .hp .saldo b{font-size:38px}
.g2.carousel .poll{width:480px}.g2.carousel .poll .opt{font-size:38px}
</style>
</head>
<body>
<div id="f"></div>
<script>
// Ukuran dasar (px) per format. fit() mengecilkan semua elemen .fit bersama-sama bila isi kepanjangan.
const S = {
  carousel:{title:124, h2:92, sub:44, txt:48, value:160, eq:48, item:48, ch:56, ct:40, stmt:90, pill:48, closing:58},
  reel:    {title:140, h2:100, sub:52, txt:54, value:190, eq:56, item:56, ch:66, ct:48, stmt:104, pill:56, closing:66}
};
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
// **teks** -> sorotan; baris baru dipertahankan
function rich(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<em class="hl">$1</em>').replace(/\n/g,"<br>")}
function el(tag,cls,html,size,extra){return `<${tag} class="${cls} fit" data-base="${size}" style="font-size:${size}px" ${extra||""}>${html}</${tag}>`}

// ---- gaya baru ----
const G2 = {
  carousel:{hook:112, title:96, h2:84, sub:42, txt:46, value:150, eq:46, item:46, ch:52, ct:38, stmt:84, pill:44, closing:36},
  reel:    {hook:124, title:110, h2:96, sub:50, txt:52, value:180, eq:54, item:54, ch:62, ct:46, stmt:100, pill:52, closing:40}
};
const SISI = {"bedah":"kanan","tanggal-tua":"kiri","tim":"kanan"};
function nominal(v){ const s=String(v??""); return s.startsWith("+")?"in":(s.startsWith("-")||s.startsWith("−"))?"out":""; }
function objHTML(o, total, revealTotal){
  if(!o) return "";
  const rv = revealTotal ? " reveal" : "";
  if(o.type==="struk"){
    const rows=(o.rows||[]).map(r=> r==="---" ? `<div class="sep"></div>`
      : `<div class="row"><span>${rich(r[0])}</span><span>${esc(r[1])}</span></div>`).join("");
    const tot=o.total ? `<div class="sep${rv}"></div><div class="row tot${rv}"><span>${esc(o.total[0])}</span><span>${esc(o.total[1])}</span></div>` : "";
    return `<div class="obj struk${o.lebar?" lebar":""}">${o.title?`<h4>${esc(o.title)}</h4>`:""}${rows}${tot}</div>`;
  }
  if(o.type==="mutasi"){
    const rows=(o.rows||[]).map(r=>`<div class="tx"><span class="n">${esc(r[0])}</span><small>${esc(r[1]||"")}</small><span class="v ${nominal(r[2])}">${esc(r[2])}</span></div>`).join("");
    const s=o.saldo ? `<div class="saldo${rv}"><span>${esc(o.saldo[0])}</span><b>${esc(o.saldo[1])}</b></div>` : "";
    return `<div class="obj hp${o.kanan?" kanan":""}${o.lebar?" lebar":""}">${o.title?`<h4>${esc(o.title)}</h4>`:""}${rows}${s}</div>`;
  }
  if(o.type==="poll"){
    const L="ABC";
    return `<div class="obj poll">${(o.options||[]).map((t,i)=>`<div class="opt"><i>${L[i]}</i>${esc(t)}</div>`).join("")}${o.ask?`<div class="ask">${rich(o.ask)}</div>`:""}</div>`;
  }
  return "";
}
function richN(s){ return rich(s).replace(/Rp\s?[\d.,]+(?:\s?(?:ribu|juta|rb|jt))?/g, m=>`<span class="nw">${m}</span>`); }
function renderG2(d){
  const f=document.getElementById("f");
  const fmt=d.format, z=G2[fmt], fr=d.frame, seri=d.seri;
  f.className = `${fmt} g2 s-${seri} ft-${fr.type} ${d.stage===0?"stage0":""} ${d.talker?"talker":""}`;
  const chip = d.chip ? `<span class="chip">${esc(d.chip)}</span>` : "<span></span>";
  const pg = fmt==="carousel" && d.total>1 ? ` · ${d.index+1}/${d.total}` : "";
  const top = `<div class="g2top">${chip}<span class="hdl">${esc(d.handle||"")}${pg}<small>${esc(d.labelAi||"")}</small></span></div>`;
  const sisi = fr.nara || SISI[seri] || "kanan";
  const nara = d.cutout ? `<img class="nara ${sisi}" src="${esc(d.cutout)}" alt="">` : "";
  let b="", fig="";
  switch(fr.type){
    case "cover":
      b += el("div","hook",richN(fr.title),z.hook);
      if(fr.sub) b += el("div","sub",rich(fr.sub),z.sub);
      if(fr.obj) b += objHTML(Object.assign({kanan: sisi==="kiri"}, fr.obj), null, false);
      if(fr.nara!=="tidak") fig = nara;
      break;
    case "struk":
      if(fr.title) b += el("div","h2",richN(fr.title),z.h2);
      b += objHTML({type:"struk", title:fr.head, rows:fr.rows, total:fr.total, lebar:true}, null, true);
      if(fr.note) b += el("div","txt muted reveal",rich(fr.note),z.sub);
      break;
    case "mutasi":
      if(fr.title) b += el("div","h2",richN(fr.title),z.h2);
      b += objHTML({type:"mutasi", title:fr.head, rows:fr.rows, saldo:fr.saldo, lebar:true}, null, true);
      break;
    case "poll":
      if(fr.title) b += el("div","h2",richN(fr.title),z.h2);
      b += objHTML({type:"poll", options:fr.options, ask:fr.ask});
      break;
    case "number":
      if(fr.label) b += el("div","label",rich(fr.label),fmt==="reel"?40:34);
      if(fr.eq) b += el("div","eq",rich(fr.eq),z.eq);
      b += el("div","value reveal",richN(fr.value),z.value);
      if(fr.note) b += el("div","txt muted reveal",rich(fr.note),z.sub);
      break;
    case "point":
      if(fr.n) b += `<div class="idx">${esc(String(fr.n).padStart(2,"0"))}</div>`;
      b += el("div","h2",richN(fr.title),z.h2);
      b += `<div class="rule"></div>`;
      if(fr.body) b += el("div","txt reveal",rich(fr.body),z.txt);
      break;
    case "list":
      if(fr.title) b += el("div","h2",richN(fr.title),z.h2);
      b += `<ul class="items">` + (fr.items||[]).map((it,i)=>{
        const mark = fr.marks ? esc(fr.marks[i]??"•") : String(i+1);
        return `<li class="fit ${i>0?"reveal":""}" data-base="${z.item}" style="font-size:${z.item}px"><span class="b">${mark}</span><span>${rich(it)}</span></li>`;
      }).join("") + `</ul>`;
      break;
    case "compare":
      if(fr.title) b += el("div","h2",richN(fr.title),z.h2);
      b += `<div class="cmp">
        <div class="card l">${el("div","ch",rich(fr.left.h),z.ch)}${el("div","ct",rich(fr.left.t),z.ct)}</div>
        <div class="card r reveal">${el("div","ch",rich(fr.right.h),z.ch)}${el("div","ct",rich(fr.right.t),z.ct)}</div>
      </div>`;
      break;
    case "statement":
      b += `<div class="quote-mark">“</div>`;
      b += el("div","h2",richN(fr.text),z.stmt);
      if(fr.sub) b += el("div","sub reveal",rich(fr.sub),z.sub);
      break;
    case "cta":
      if(fr.title) b += el("div","title",richN(fr.title),z.title);
      if(fr.body) b += el("div","txt",rich(fr.body),z.txt);
      if(fr.pill) b += `<div class="pill fit reveal" data-base="${z.pill}" style="font-size:${z.pill}px">${rich(fr.pill)} <span class="arrow">→</span></div>`;
      b += el("div","closing",esc(d.closing),z.closing);
      fig = nara;
      break;
    default:
      b += el("div","h2",rich(fr.title||fr.text||""),z.h2);
  }
  if(!fig && fmt==="reel" && d.cutout && fr.nara!=="tidak" && d.naraKecil!==false) fig = `<img class="nara kecil" src="${esc(d.cutout)}" alt="">`;
  if(fig) f.classList.add("ada-nara");
  f.innerHTML = top + `<div class="body">${b}</div>` + fig;
  fit();
  return true;
}

window.renderFrame = function(d){
  if(d.seri) return renderG2(d);
  const f=document.getElementById("f");
  const fmt=d.format, z=S[fmt], fr=d.frame;
  const theme = fr.theme || ({cover:"olive",cta:"olive",statement:"dark"}[fr.type]||"cream");
  f.className = `${fmt} t-${theme} ${d.stage===0?"stage0":""} ${d.talker?"talker":""}`;
  const pg = fmt==="carousel" ? `<span class="pg">${d.index+1}/${d.total}</span>` : "";
  const mark = (d.avatar && d.topAvatar !== false) ? `<img class="ava" src="${esc(d.avatar)}" alt="">` : `<span class="dot"></span>`;
  let top = `<div class="top"><span class="sig">${mark}${esc(d.signature)}</span>${pg}</div>`;
  let b="", foot="";
  switch(fr.type){
    case "cover":
      if(d.avatar && d.index===0 && !d.talker) b += `<div class="presenter"><img src="${esc(d.avatar)}" alt="Nara"><div><div class="hi">${esc(d.greeting||"")}</div><div class="role">${esc(d.role||"")}</div></div></div>`;
      b += fr.kicker ? `<div class="kicker">${esc(fr.kicker)}</div>` : "";
      b += el("div","title",rich(fr.title),z.title);
      if(fr.sub) b += el("div","sub",rich(fr.sub),z.sub);
      foot = fmt==="carousel" && d.total>1 ? `<span>${esc(fr.footer||"Simpan dulu, baca pelan-pelan")}</span><span>Geser →</span>` : "";
      break;
    case "number":
      if(fr.label) b += el("div","label",rich(fr.label),fmt==="reel"?40:34);
      if(fr.eq) b += el("div","eq",rich(fr.eq),z.eq);
      b += el("div","value reveal",rich(fr.value),z.value);
      if(fr.note) b += el("div","txt muted reveal",rich(fr.note),z.sub);
      break;
    case "point":
      if(fr.n) b += `<div class="idx">${esc(String(fr.n).padStart(2,"0"))}</div>`;
      b += el("div","h2",rich(fr.title),z.h2);
      b += `<div class="rule"></div>`;
      if(fr.body) b += el("div","txt reveal",rich(fr.body),z.txt);
      break;
    case "list":
      if(fr.title) b += el("div","h2",rich(fr.title),z.h2);
      b += `<ul class="items">` + (fr.items||[]).map((it,i)=>{
        const mark = fr.marks ? esc(fr.marks[i]??"•") : String(i+1);
        return `<li class="fit ${i>0?"reveal":""}" data-base="${z.item}" style="font-size:${z.item}px"><span class="b">${mark}</span><span>${rich(it)}</span></li>`;
      }).join("") + `</ul>`;
      break;
    case "compare":
      if(fr.title) b += el("div","h2",rich(fr.title),z.h2);
      b += `<div class="cmp">
        <div class="card l">${el("div","ch",rich(fr.left.h),z.ch)}${el("div","ct",rich(fr.left.t),z.ct)}</div>
        <div class="card r reveal">${el("div","ch",rich(fr.right.h),z.ch)}${el("div","ct",rich(fr.right.t),z.ct)}</div>
      </div>`;
      break;
    case "statement":
      b += `<div class="quote-mark">“</div>`;
      b += el("div","h2",rich(fr.text),z.stmt);
      if(fr.sub) b += el("div","sub reveal",rich(fr.sub),z.sub);
      break;
    case "cta":
      if(fr.title) b += el("div","title",rich(fr.title),fmt==="reel"?110:96);
      if(fr.body) b += el("div","txt",rich(fr.body),z.txt);
      if(fr.pill) b += `<div class="pill fit reveal" data-base="${z.pill}" style="font-size:${z.pill}px">${rich(fr.pill)} <span class="arrow">→</span></div>`;
      b += el("div","closing",esc(d.closing),z.closing);
      foot = fmt==="carousel" ? `<span>${esc(d.signature)}</span><span>Karakter AI · bukan nasihat investasi</span>` : "";
      break;
    default:
      b += el("div","h2",rich(fr.title||fr.text||""),z.h2);
  }
  f.innerHTML = top + `<div class="body">${b}</div>` + `<div class="foot">${foot}</div>`;
  fit();
  return true;
};

function fit(){
  const body=document.querySelector("#f .body");
  const nodes=[...document.querySelectorAll("#f .fit")];
  let s=1;
  const apply=()=>nodes.forEach(n=>n.style.fontSize=(parseFloat(n.dataset.base)*s)+"px");
  apply();
  // stage0 menyembunyikan dengan opacity, jadi ukuran tetap dihitung dari isi lengkap
  for(let i=0;i<40 && body.scrollHeight>body.clientHeight+1;i++){ s-=0.025; apply(); }
  // judul tidak boleh meluber horizontal (kata panjang)
  document.querySelectorAll("#f .title,#f .value,#f .hook").forEach(n=>{
    let k=0; while(n.scrollWidth>n.clientWidth+1 && k<30){ n.style.fontSize=(parseFloat(n.style.fontSize)*0.96)+"px"; k++; }
  });
  window.__fitScale=s;
}
</script>
